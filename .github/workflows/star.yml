name: Parse M3U and Generate JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Runs every 2 hours

jobs:
  run-parser:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: |
          python star.py > star.json

      - name: Commit and push changes if results changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add star.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update parsed M3U JSON results [skip ci]" && git push)
