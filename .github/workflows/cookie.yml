name: Update Cookie

on:
  schedule:
    # Runs every 3 hours precisely (at minute 0 of every 3rd hour: 00:00, 06:00, 12:00, 18:00)
    - cron: '0 */3 * * *'  
  workflow_dispatch:        # Allows manual trigger from GitHub Actions tab

concurrency:
  group: update-cookie-job
  cancel-in-progress: false # Ensures a running job finishes instead of getting skipped or killed

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script to Update Cookie
        run: |
          python cookie.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cookie.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cookie.json [skip ci]" && git pull --rebase origin main && git push)
