name: Auto Update JSON

on:
  schedule:
    # Runs every 3 hours. Change the cron expression if you want a different frequency.
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit and push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Python script
        run: python starori.py

      - name: Commit and push if changes detected
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add star1.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JSON star1 [skip ci]" && git push)
