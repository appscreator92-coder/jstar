
name: Fetch __hdnea__ Tokens

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-hdnea-tokens
  cancel-in-progress: false

jobs:
  fetch-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests brotli zstandard

      - name: Run token fetcher
        run: python -u fetch_hdnea.py

      - name: Validate JSON
        run: |
          python -m json.tool hdnea_tokens.json > /dev/null
          echo "JSON validation successful"

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hdnea_tokens.json

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Update HDNEA tokens [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
