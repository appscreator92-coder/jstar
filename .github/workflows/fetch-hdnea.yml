name: Fetch __hdnea__ Tokens

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests brotli zstandard

      - name: Run token fetcher script
        run: python fetch_hdnea.py

      - name: Commit and push updated tokens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hdnea_tokens.json
          if git diff --staged --quiet; then
            echo "No changes to hdnea_tokens.json"
          else
            git commit -m "Update __hdnea__ tokens [skip ci]"
            git push
          fi
