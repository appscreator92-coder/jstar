
name: Fetch Channel Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

permissions:
  contents: write

jobs:
  fetch-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run diagnostics
        run: python -u fetch_hdnea.py

      - name: Validate JSON
        run: python -m json.tool hdnea_tokens.json > /dev/null

      - name: Display summary
        run: |
          python - <<'PY'
          import json

          with open("hdnea_tokens.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Total:", data["total_channels"])

          for status, count in data["summary"].items():
              print(status + ":", count)
          PY

      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hdnea_tokens.json
          git diff --cached --quiet || git commit -m "Update channel diagnostics"
          git push
