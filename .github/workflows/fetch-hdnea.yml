
name: Fetch HDNEA Tokens

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-hdnea-tokens
  cancel-in-progress: false

jobs:
  fetch-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run HDNEA extractor
        run: python -u fetch_hdnea.py

      - name: Validate generated JSON
        run: |
          python -m json.tool hdnea_tokens.json > /dev/null
          echo "JSON validation successful"

      - name: Display extraction summary
        run: |
          python - <<'PY'
          import json

          with open("hdnea_tokens.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Total:", data["total_channels"])
          print("Successful:", data["successful_channels"])
          print("Failed:", data["failed_channels"])
          PY

      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hdnea_tokens.json

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Update HDNEA tokens [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
